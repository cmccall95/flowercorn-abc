name: Check the in-app voice

# Loads the in-app voice (Kokoro, in the browser) like a phone would, has it say every letter line,
# listens with a phoneme recognizer, and commits scripts/voices/engine-report.md.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/audio/engine/**
      - scripts/voices/fetch_model.py
      - src/audio/lines.ts
      - e2e/engine-check.mjs
      - scripts/voices/engine_verify.py
      - scripts/voices/common.py
      - src/audio/carrier.ts
      - src/audio/sayLetter.ts

permissions:
  contents: write

concurrency:
  group: engine-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-onnx-q8-v1
      # The in-app voice's files are hosted with the site, so phones load them from us.
      - run: pip install huggingface_hub && python scripts/voices/fetch_model.py public/models
      - run: npm run build
      - run: npm i --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - name: Have the in-app voice say every letter line
        id: say
        run: |
          mkdir -p engine-out
          npx vite preview --port 4173 > engine-out/server.txt 2>&1 &
          npx --yes wait-on@8.0.1 -t 60000 http://localhost:4173/flowercorn-abc/
          set -o pipefail
          node e2e/engine-check.mjs http://localhost:4173/flowercorn-abc/ engine-out 2>&1 | tee engine-out/log.txt
      - name: Report a failure (so it can be read from the repo)
        if: failure() && steps.say.outcome == 'failure'
        run: |
          { echo '# In-app voice check'; echo; echo 'The voice did not finish. Log:'; echo; echo '```'; tail -n 80 engine-out/log.txt; echo '```'; } > scripts/voices/engine-report.md
      - if: steps.say.outcome == 'success'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: steps.say.outcome == 'success'
        run: pip install -r scripts/voices/requirements.txt
      - if: steps.say.outcome == 'success'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: wav2vec2-phonemes-v1
      - if: steps.say.outcome == 'success'
        run: python scripts/voices/engine_verify.py engine-out scripts/voices/engine-report.md
      - if: always()
        run: cat scripts/voices/engine-report.md >> "$GITHUB_STEP_SUMMARY" || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-audio
          path: engine-out
      - name: Commit report
        if: always()
        run: |
          git add scripts/voices/engine-report.md
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "In-app voice check report"
          git pull --rebase origin main && git push
