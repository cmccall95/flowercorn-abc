name: Check the in-app voice

# Loads the in-app voice (Kokoro, in the browser) like a phone would, has it say every letter line,
# listens with Whisper, and commits scripts/voices/engine-report.md.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/audio/engine/**
      - src/audio/lines.ts
      - e2e/engine-check.mjs
      - scripts/voices/engine_verify.py

permissions:
  contents: write

concurrency:
  group: engine-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm i --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: npx vite preview --port 4173 &
      - run: node e2e/engine-check.mjs http://localhost:4173/flowercorn-abc/ engine-out
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy faster-whisper==1.2.1
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1
      - run: python scripts/voices/engine_verify.py engine-out scripts/voices/engine-report.md
      - run: cat scripts/voices/engine-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: engine-audio
          path: engine-out
      - name: Commit report
        run: |
          git add scripts/voices/engine-report.md
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "In-app voice check report"
          git pull --rebase origin main && git push
