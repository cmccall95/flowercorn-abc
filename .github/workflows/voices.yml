name: Generate voice clips

# Makes the bundled letter/number clips with Kokoro (open-source TTS), commits them, then redeploys.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/audio/lines.ts
      - src/content/names.ts
      - src/content/phonics.ts
      - src/content/words.ts
      - src/content/sets.ts
      - src/content/phrases.ts
      - src/content/cheers.ts
      - src/content/stickers.ts
      - scripts/voices/*.py
      - scripts/voices/*.ts
      - scripts/voices/requirements.txt

permissions:
  contents: write
  actions: write

concurrency:
  group: voices
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/voices/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r scripts/voices/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-82m-whisper-small-v1
      # 1. Listen to several spellings of each letter name and keep the one Whisper hears correctly.
      - run: python scripts/voices/letters.py src/content/letterVoice.gen.json scripts/voices/letters-report.md
      # 2. List every line the game says, using those spellings.
      - run: npx vite-node scripts/voices/manifest.ts > scripts/voices/manifest.json
      # 3. Make the clips that are new or changed.
      - run: python scripts/voices/generate.py scripts/voices/manifest.json public/voice
      # 4. Listen to every letter clip and report any that don't name their letter.
      - run: python scripts/voices/verify.py scripts/voices/manifest.json public/voice scripts/voices/report.md
      - run: cat scripts/voices/letters-report.md scripts/voices/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit clips
        id: commit
        run: |
          git add public/voice src/content/letterVoice.gen.json scripts/voices/letters-report.md scripts/voices/report.md
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update voice clips" -m "$(head -c 3000 scripts/voices/report.md)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Redeploy with the new clips
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
