name: Generate voice clips

# Makes the bundled clips (letter names from Commons recordings and Kokoro; words with Kokoro), commits them,
# then redeploys.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/audio/lines.ts
      - src/content/names.ts
      - src/content/phonics.ts
      - src/content/words.ts
      - src/content/sets.ts
      - src/content/phrases.ts
      - src/content/cheers.ts
      - src/content/stickers.ts
      - scripts/voices/*.py
      - scripts/voices/*.ts
      - scripts/voices/requirements.txt

permissions:
  contents: write
  actions: write

concurrency:
  group: voices
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/voices/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r scripts/voices/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-82m-wav2vec2-phonemes-v1
      - uses: actions/cache@v4
        with:
          path: ~/.cache/commons-letters
          key: commons-spanish-letters-v1
      # 1. Letter names: Commons recordings (Spanish, CC0) and Kokoro "A. A." with the first copy cut off,
      #    each checked with a phoneme recognizer.
      - run: set -o pipefail; python scripts/voices/letter_names.py public/voice/letters scripts/voices/letters-report.md 2>&1 | tee -a voices-log.txt
      # 2. List every line of words the game says (letter names are separate clips).
      - run: npx vite-node scripts/voices/manifest.ts > scripts/voices/manifest.json
      # 3. Make the clips that are new or changed.
      - run: set -o pipefail; python scripts/voices/generate.py scripts/voices/manifest.json public/voice 2>&1 | tee -a voices-log.txt
      - run: cat scripts/voices/letters-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit clips
        id: commit
        run: |
          git add -A public/voice scripts/voices/letters-report.md
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update voice clips" -m "$(head -c 3000 scripts/voices/letters-report.md)"
          git pull --rebase origin main && git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Redeploy with the new clips
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
      # Job logs can't be read from outside GitHub, so a failure commits the end of the log as the report.
      - name: Commit the log if something failed
        if: failure()
        run: |
          { echo '# Letter-name clips'; echo; echo 'The clip builder failed. Log:'; echo; echo '```'; tail -n 80 voices-log.txt; echo '```'; } > scripts/voices/letters-report.md
          git add scripts/voices/letters-report.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Voice clips: failure log" && git pull --rebase origin main && git push
