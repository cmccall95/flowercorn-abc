name: Generate voice clips

# Makes the bundled letter/number clips with Kokoro (open-source TTS), commits them, then redeploys.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/audio/lines.ts
      - src/content/names.ts
      - src/content/phonics.ts
      - src/content/words.ts
      - src/content/sets.ts
      - scripts/voices/**

permissions:
  contents: write
  actions: write

concurrency:
  group: voices
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite-node scripts/voices/manifest.ts > scripts/voices/manifest.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/voices/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r scripts/voices/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-82m-v1
      - run: python scripts/voices/generate.py scripts/voices/manifest.json public/voice
      - name: Commit clips
        id: commit
        run: |
          git add public/voice
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update voice clips"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Redeploy with the new clips
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
